[project]
name = "handmotion"
description = "handmotion"
version = "0.0.1"
readme = "README.md"
keywords = []
authors = [{name = "Julia Jia"}]
requires-python = ">=3.12,<3.13"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.dependencies]

[tool.pixi.pypi-dependencies]
handmotion = { path = ".", editable = true }
mediapipe = "*"
numpy = "*"
pillow = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default"}

[tool.pixi.feature.dev.tasks]
fmt = { cmd="ruff format .", clean-env = true }
lint = { cmd="ruff check . --fix", clean-env = true }
types = { cmd="ty check", clean-env = true }
test = { cmd="pytest", clean-env = true }
pre-commit = { cmd="pre-commit run --all-files" }
pre-commit-install = { cmd="pre-commit install" }
all = { depends-on = ["fmt", "lint", "types", "test"] }

[tool.pixi.feature.dev.dependencies]
pytest = ">=8.3"
ruff = ">=0.11"
pre-commit = ">=4.2"

[tool.pixi.feature.dev.pypi-dependencies]
ty = "*"

# Unset ROS2 environment variables to avoid tool conflicts when
# ROS2 setup scripts are sourced in .bashrc (e.g., source /opt/ros/jazzy/setup.bash)
[tool.pixi.activation]
scripts = ["scripts/unset_ros2_env.sh"]

[tool.pixi.feature.dev.activation]
scripts = ["scripts/unset_ros2_env.sh"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "B",   # bugbear
    "N",   # pep8-naming
    "PT",  # pytest-style
    "RUF", # Ruff-specific rules
]
ignore = [
    "N806", # Non-lowercase variable in function
    "PLR0911", # Too many returns
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments to function call
    "PLR0914", # Too many locals
    "PLR0915", # Too many statements
    "PLR1702", # Too many nested-blocks
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests", "handmotion"]
addopts = "--doctest-modules"
doctest_optionflags = "NORMALIZE_WHITESPACE"

[tool.hatchling.build.targets.wheel]
packages = ["handmotion"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
